    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style data-purpose="typography">
      body {
        font-family: 'Manrope', sans-serif;
      }
      .bg-gradient-btn {
        background: linear-gradient(90deg, #264dd9 0%, #6366f1 100%);
      }
      .qr-scanner-frame {
        position: relative;
        width: 200px;
        height: 200px;
        margin: 0 auto;
      }
      .qr-scanner-frame::before, .qr-scanner-frame::after,
      .qr-scanner-frame .corners::before, .qr-scanner-frame .corners::after {
        content: '';
        position: absolute;
        width: 24px;
        height: 24px;
        border-color: #264dd9;
        border-style: solid;
      }
      .qr-scanner-frame::before { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 8px; }
      .qr-scanner-frame::after { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 8px; }
      .qr-scanner-frame .corners::before { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 8px; }
      .qr-scanner-frame .corners::after { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 8px; }

      .scanning-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #264dd9, transparent);
        box-shadow: 0 0 8px #264dd9;
        animation: scan 2s linear infinite;
      }
      @keyframes scan {
        0% { top: 0; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
    </style>
